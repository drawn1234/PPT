<!DOCTYPE html>

  <title>工作成果｜直播互动核心体验提升</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05060a;
    }

    body {
      font-family:
        "Microsoft YaHei",
        "PingFang SC",
        "Noto Sans CJK SC",
        Arial,
        sans-serif;
    }

    /* 浏览器可视区域 */
    #viewport {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #05060a;
    }

    /* 固定 1600 × 900 设计画布 */
    #slide {
      display: block;
      width: 1600px;
      height: 900px;
      max-width: none;
      max-height: none;
      flex: 0 0 auto;
      transform-origin: center center;
      will-change: transform;
    }

    /* 打印设置 */
    @media print {
      @page {
        size: 1600px 900px;
        margin: 0;
      }

      html,
      body,
      #viewport {
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background: #05060a;
      }

      #slide {
        transform: none !important;
      }
    }

    /* 用户不需要动画时，禁用尺寸变化过渡 */
    @media (prefers-reduced-motion: reduce) {
      #slide {
        transition: none;
      }
    }
  </style>
</head>

  <script>
    const DESIGN_WIDTH = 1600;
    const DESIGN_HEIGHT = 900;

    const slide = document.getElementById("slide");

    /**
     * 获取当前浏览器真实可视区域，
     * 并将 1600 × 900 画布整体等比例缩放。
     */
    function resizeSlide() {
      const viewportWidth = window.visualViewport
        ? window.visualViewport.width
        : window.innerWidth;

      const viewportHeight = window.visualViewport
        ? window.visualViewport.height
        : window.innerHeight;

      const scale = Math.min(
        viewportWidth / DESIGN_WIDTH,
        viewportHeight / DESIGN_HEIGHT
      );

      slide.style.transform = `scale(${scale})`;
    }

    resizeSlide();

    window.addEventListener("load", resizeSlide);
    window.addEventListener("resize", resizeSlide);
    window.addEventListener("orientationchange", resizeSlide);

    if (window.visualViewport) {
      window.visualViewport.addEventListener(
        "resize",
        resizeSlide
      );
    }
  </script>
