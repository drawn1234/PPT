<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>试用期工作汇报</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #05060a;
      --panel: rgba(18, 19, 29, 0.88);
      --line: rgba(255, 255, 255, 0.12);

      --white: #f7f7f9;
      --muted: #8d92a1;

      --purple: #8b7cff;
      --purple-light: #c3bbff;

      --yellow: #f2b93b;
      --yellow-light: #ffd466;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);

      font-family:
        "Microsoft YaHei",
        "PingFang SC",
        Arial,
        sans-serif;
    }

    body {
      color: var(--white);
    }

    /* 整体演示容器 */
    #presentation {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #05060a;
    }

    /* 页面 iframe */
    #slide-frame {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;
      outline: 0;
      background: #05060a;

      opacity: 1;
      transition:
        opacity 0.18s ease,
        transform 0.18s ease;
    }

    #slide-frame.changing-next {
      opacity: 0;
      transform: translateX(12px);
    }

    #slide-frame.changing-prev {
      opacity: 0;
      transform: translateX(-12px);
    }

    /* 顶部进度条 */
    .progress-track {
      position: fixed;
      z-index: 20;
      top: 0;
      left: 0;
      right: 0;

      height: 3px;
      background: rgba(255, 255, 255, 0.04);
    }

    .progress-bar {
      width: 0;
      height: 100%;

      background: linear-gradient(
        90deg,
        var(--yellow),
        var(--purple)
      );

      box-shadow:
        0 0 12px rgba(139, 124, 255, 0.4);

      transition: width 0.25s ease;
    }

    /* 左右翻页热区 */
    .page-zone {
      position: fixed;
      z-index: 10;
      top: 0;
      bottom: 0;

      width: 56px;

      border: 0;
      padding: 0;

      color: rgba(255, 255, 255, 0.72);
      background: transparent;

      cursor: pointer;

      transition: background 0.22s ease;
    }

    .page-zone.prev {
      left: 0;
    }

    .page-zone.next {
      right: 0;
    }

    /*
     * 仅鼠标进入对应边缘热区或键盘聚焦时，
     * 才显示轻微边缘渐变。
     */
    .page-zone.prev:hover,
    .page-zone.prev:focus-visible {
      background: linear-gradient(
        90deg,
        rgba(5, 6, 10, 0.55),
        transparent
      );
    }

    .page-zone.next:hover,
    .page-zone.next:focus-visible {
      background: linear-gradient(
        -90deg,
        rgba(5, 6, 10, 0.55),
        transparent
      );
    }

    .page-zone:focus {
      outline: none;
    }

    .page-zone:disabled,
    .page-zone[hidden] {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .zone-icon {
      position: absolute;
      top: 50%;

      width: 40px;
      height: 40px;

      display: flex;
      align-items: center;
      justify-content: center;

      transform: translateY(-50%);

      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 50%;

      color: inherit;
      background: rgba(15, 16, 25, 0.65);
      backdrop-filter: blur(10px);

      font-size: 21px;

      opacity: 0;
      transition:
        opacity 0.22s ease,
        transform 0.22s ease;
    }

    .page-zone.prev .zone-icon {
      left: 20px;
    }

    .page-zone.next .zone-icon {
      right: 20px;
    }

    .page-zone.prev:hover .zone-icon,
    .page-zone.next:hover .zone-icon {
      opacity: 0.8;
    }

    .page-zone.prev:focus-visible .zone-icon {
      opacity: 0.8;
      transform: translateY(-50%) translateX(2px);
    }

    .page-zone.next:focus-visible .zone-icon {
      opacity: 0.8;
      transform: translateY(-50%) translateX(-2px);
    }

    /* 底部控制栏 */
    .controls {
      position: fixed;
      z-index: 30;
      right: 22px;
      bottom: 18px;

      height: 42px;
      padding: 0 8px 0 15px;

      display: flex;
      align-items: center;
      gap: 10px;

      border: 1px solid var(--line);
      border-radius: 22px;

      background: var(--panel);
      backdrop-filter: blur(14px);

      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);

      opacity: 0;
      transform: translateY(calc(100% + 22px));
      pointer-events: none;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    /*
     * 显示控制栏的几种触发场景：
     * 窗口底部热区、鼠标移动、自身 hover、
     * 内部元素键盘聚焦、帮助面板打开。
     */
    #presentation.controls-visible .controls,
    #presentation.controls-pinned .controls,
    .controls:hover,
    .controls:focus-within {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .page-number {
      min-width: 62px;

      color: #dadbe1;
      font-size: 12px;
      font-weight: 650;
      text-align: center;
    }

    .page-number strong {
      color: var(--yellow-light);
      font-size: 14px;
    }

    .control-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.12);
    }

    .control-button {
      width: 30px;
      height: 30px;
      padding: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid transparent;
      border-radius: 50%;

      color: #aaaebb;
      background: transparent;

      font-size: 15px;
      cursor: pointer;

      transition:
        color 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .control-button:hover {
      color: var(--white);
      border-color: rgba(139, 124, 255, 0.35);
      background: rgba(139, 124, 255, 0.1);
    }

    /* 帮助面板 */
    .help-panel {
      position: fixed;
      z-index: 100;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      background: rgba(3, 4, 8, 0.72);
      backdrop-filter: blur(8px);
    }

    .help-panel.visible {
      display: flex;
    }

    .help-card {
      width: 460px;
      padding: 28px;

      border: 1px solid rgba(139, 124, 255, 0.28);
      border-radius: 18px;

      background:
        radial-gradient(
          circle at 90% 10%,
          rgba(139, 124, 255, 0.12),
          transparent 36%
        ),
        #151722;

      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
    }

    .help-title {
      margin: 0 0 20px;

      color: var(--white);
      font-size: 21px;
    }

    .shortcut-list {
      display: grid;
      grid-template-columns: 125px 1fr;
      gap: 13px 18px;

      color: #aeb2bf;
      font-size: 13px;
    }

    .shortcut-key {
      color: var(--purple-light);
      font-weight: 700;
    }

    .help-close {
      width: 100%;
      height: 38px;
      margin-top: 25px;

      border: 1px solid rgba(242, 185, 59, 0.35);
      border-radius: 9px;

      color: var(--yellow-light);
      background: rgba(242, 185, 59, 0.07);

      cursor: pointer;
    }

    /* 加载提示 */
    .loading {
      position: fixed;
      z-index: 5;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #7d8291;
      background: #080910;

      font-size: 12px;
      letter-spacing: 2px;
    }

    .loading.hidden {
      display: none;
    }

    /* 弱化动画偏好下，取消位移动画 */
    @media (prefers-reduced-motion: reduce) {
      .controls,
      #slide-frame,
      .zone-icon,
      .page-zone {
        transition: none;
      }

      .controls {
        transform: none;
      }

      #presentation.controls-visible .controls,
      #presentation.controls-pinned .controls,
      .controls:hover,
      .controls:focus-within {
        transform: none;
      }
    }

    /* 触屏设备隐藏圆形翻页图标 */
    @media (hover: none) {
      .page-zone .zone-icon {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main id="presentation">

    <!-- 页面加载提示 -->
    <div id="loading" class="loading hidden">
      LOADING PRESENTATION
    </div>

    <!--
      每一页通过 iframe 独立加载，避免 CSS 冲突。
      iframe 由脚本创建，以便在创建前绑定 load 监听。
    -->

    <!-- 顶部进度 -->
    <div class="progress-track">
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <!-- 左右翻页 -->
    <button
      id="prev-zone"
      class="page-zone prev"
      type="button"
      aria-label="上一页"
    >
      <span class="zone-icon">‹</span>
    </button>

    <button
      id="next-zone"
      class="page-zone next"
      type="button"
      aria-label="下一页"
    >
      <span class="zone-icon">›</span>
    </button>

    <!-- 底部操作栏 -->
    <nav class="controls" aria-label="演示控制">
      <div id="page-number" class="page-number"></div>

      <span class="control-divider"></span>

      <button
        id="prev-button"
        class="control-button"
        type="button"
        aria-label="上一页"
      >
        ‹
      </button>

      <button
        id="next-button"
        class="control-button"
        type="button"
        aria-label="下一页"
      >
        ›
      </button>

      <button
        id="fullscreen-button"
        class="control-button"
        type="button"
        aria-label="全屏"
      >
        ⛶
      </button>

      <button
        id="help-button"
        class="control-button"
        type="button"
        aria-label="快捷键说明"
      >
        ?
      </button>
    </nav>

    <!-- 快捷键说明 -->
    <section id="help-panel" class="help-panel">
      <div class="help-card">
        <h2 class="help-title">演示快捷键</h2>

        <div class="shortcut-list">
          <div class="shortcut-key">→ / ↓ / Space</div>
          <div>下一页</div>

          <div class="shortcut-key">← / ↑</div>
          <div>上一页</div>

          <div class="shortcut-key">Home</div>
          <div>跳转到第一页</div>

          <div class="shortcut-key">End</div>
          <div>跳转到最后一页</div>

          <div class="shortcut-key">F</div>
          <div>进入或退出全屏</div>

          <div class="shortcut-key">R</div>
          <div>重新加载当前页</div>

          <div class="shortcut-key">H / ?</div>
          <div>显示或关闭快捷键说明</div>

          <div class="shortcut-key">Esc</div>
          <div>关闭帮助或退出全屏</div>
        </div>

        <button
          id="help-close"
          class="help-close"
          type="button"
        >
          关闭
        </button>
      </div>
    </section>

  </main>

  <script>
    /*
     * ====================================================
     * 只需要修改这里的页面列表
     * ====================================================
     *
     * file：HTML 文件路径
     * title：页面名称（用于浏览器标签标题）
     */

    const slides = [
      {
        file: "1-封面.html",
        title: "试用期工作汇报"
      },
      {
        file: "2-目录.html",
        title: "目录"
      },
      {
        file: "3-个人简介.html",
        title: "个人简介"
      },
      {
        file: "4-工作产出.html",
        title: "工作与产出"
      },
      {
        file: "4-工作产出1.html",
        title: "工作内容｜从基础能力到业务体验"
      },
      {
        file: "6-工作成果1.html",
        title: "平台会员接入｜情境与功能"
      },
      {
        file: "7-工作成果2.html",
        title: "平台会员接入｜行动与结果"
      },
      {
        file: "8-工作挑战1.html",
        title: "弹幕挑战｜问题现象"
      },
      {
        file: "9-工作挑战2.html",
        title: "弹幕挑战｜处理链路"
      },
      {
        file: "10-工作挑战3.html",
        title: "弹幕挑战｜排查行动与结果"
      },
      {
        file: "11-AI应用实践.html",
        title: "AI 应用实践｜协作模式"
      },
      {
        file: "12-AI案例.html",
        title: "AI 案例反思｜猜测不等于实际"
      },
      {
        file: "13-AI使用.html",
        title: "AI 能力边界与人工判断"
      },
      {
        file: "14-AI转变.html",
        title: "AI 使用转变｜从要答案到放大判断"
      },
      {
        file: "15-下一步规划.html",
        title: "下一步规划｜从完成任务到独立负责"
      },
      {
        file: "16-谢语.html",
        title: "谢谢聆听"
      }
    ];

    let frame = null;
    const loading = document.getElementById("loading");

    const prevZone = document.getElementById("prev-zone");
    const nextZone = document.getElementById("next-zone");

    const prevButton = document.getElementById("prev-button");
    const nextButton = document.getElementById("next-button");

    const fullscreenButton = document.getElementById(
      "fullscreen-button"
    );

    const controlsEl = document.querySelector(".controls");

    const helpButton = document.getElementById("help-button");
    const helpPanel = document.getElementById("help-panel");
    const helpClose = document.getElementById("help-close");

    const progressBar = document.getElementById("progress-bar");
    const pageNumber = document.getElementById("page-number");

    let currentIndex = getInitialPage();
    let changing = false;
    let navigationToken = 0;
    let loadFallbackTimer = null;
    let boundFrameDocument = null;
    let controlsTimer = null;
    let helpOpen = false;
    let pointerInRevealZone = false;

    const CONTROLS_HIDE_DELAY = 1700;
    const CONTROLS_REVEAL_ZONE = 80;
    const IFRAME_LOAD_TIMEOUT = 5000;

    /**
     * 支持通过 URL 页码直接打开。
     *
     * 示例：
     * index.html?page=5
     * index.html#5
     */
    function getInitialPage() {
      const query = new URLSearchParams(window.location.search);
      const queryPage = Number(query.get("page"));
      const hashPage = Number(
        window.location.hash.replace("#", "")
      );

      const requestedPage = queryPage || hashPage || 1;

      return Math.min(
        Math.max(requestedPage - 1, 0),
        slides.length - 1
      );
    }

    /**
     * 显示指定页面。
     *
     * 等待 iframe 真正加载完成后再淡入，
     * 避免未加载完成就淡入造成切页闪烁。
     */
    function showSlide(index, direction = "next", immediate = false) {
      if (
        changing ||
        index < 0 ||
        index >= slides.length
      ) {
        return;
      }

      const targetSlide = slides[index];

      changing = true;

      /*
       * 递增请求令牌，防止旧页面延迟触发的
       * load / 超时回调错误结束新页面切换。
       */
      const token = ++navigationToken;

      clearTimeout(loadFallbackTimer);
      loadFallbackTimer = null;

      frame.classList.add("is-loading");

      if (!immediate) {
        frame.classList.add(
          direction === "prev"
            ? "changing-prev"
            : "changing-next"
        );
      }

      /*
       * 首次加载立即切换；
       * 后续切换等待约 60ms 淡出后再切换 src。
       * 展示层不再主动显示 Loading，避免切页闪屏。
       */
      const prefersReducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      const delay =
        immediate || prefersReducedMotion
          ? 0
          : 60;

      window.setTimeout(() => {
        if (token !== navigationToken) {
          return;
        }

        currentIndex = index;

        frame.src = targetSlide.file;
        updateInterface();
        updateAddress();

        /*
         * 加载失败时的兜底，
         * 避免 changing 被永久锁死。
         */
        loadFallbackTimer = window.setTimeout(
          () => {
            if (token !== navigationToken) {
              return;
            }

            finalizeSlideChange();
          },
          IFRAME_LOAD_TIMEOUT
        );
      }, delay);
    }

    /**
     * 完成一次页面切换：
     * 隐藏加载层、移除过渡类、解锁翻页。
     */
    function finalizeSlideChange() {
      clearTimeout(loadFallbackTimer);
      loadFallbackTimer = null;

      loading.classList.add("hidden");
      frame.classList.remove("is-loading");

      frame.classList.remove(
        "changing-prev",
        "changing-next"
      );

      changing = false;
    }

    /**
     * 更新页码、进度、按钮状态与页面名称。
     */
    function updateInterface() {
      const currentPage = currentIndex + 1;
      const totalPage = slides.length;

      pageNumber.innerHTML =
        `<strong>${String(currentPage).padStart(2, "0")}</strong>` +
        ` / ${String(totalPage).padStart(2, "0")}`;

      progressBar.style.width =
        `${(currentPage / totalPage) * 100}%`;

      prevZone.disabled = currentIndex === 0;
      prevButton.disabled = currentIndex === 0;

      nextZone.disabled =
        currentIndex === slides.length - 1;

      nextButton.disabled =
        currentIndex === slides.length - 1;

      document.title =
        `${slides[currentIndex].title} ` +
        `(${currentPage}/${totalPage})`;
    }

    /**
     * 把当前页码写入地址栏。
     * 刷新之后仍能停留在当前页。
     */
    function updateAddress() {
      history.replaceState(
        null,
        "",
        `${window.location.pathname}` +
        `${window.location.search}#${currentIndex + 1}`
      );
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        showSlide(currentIndex + 1, "next");
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        showSlide(currentIndex - 1, "prev");
      }
    }

    function firstSlide() {
      if (currentIndex !== 0) {
        showSlide(0, "prev");
      }
    }

    function lastSlide() {
      if (currentIndex !== slides.length - 1) {
        showSlide(slides.length - 1, "next");
      }
    }

    /**
     * 全屏切换。
     */
    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document
            .getElementById("presentation")
            .requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        console.warn("浏览器未允许进入全屏：", error);
      }
    }

    /**
     * 帮助面板。
     */
    function toggleHelp(force) {
      const shouldShow =
        typeof force === "boolean"
          ? force
          : !helpPanel.classList.contains("visible");

      helpPanel.classList.toggle("visible", shouldShow);

      helpOpen = shouldShow;

      if (shouldShow) {
        showControls();
      } else {
        scheduleHideControls();
      }
    }

    /**
     * iframe 加载完成。
     */
    let frameListenersAttached = false;

    /**
     * iframe 加载完成。
     */
    function handleFrameLoad() {
      if (!changing) {
        /*
         * 非本层发起的加载（例如 R 刷新），
         * 只隐藏加载层，不触碰切换状态。
         */
        loading.classList.add("hidden");
      } else {
        finalizeSlideChange();
      }

      /*
       * 同源 iframe 内部同样需要支持翻页（键盘、
       * 鼠标、触屏）。统一按 contentDocument 管理：
       * 同源导航后文档对象必定更新，因此每个
       * 新文档都会重新绑定；而同一文档只绑定一次，
       * 避免重复监听导致一次操作跳两页。
       */
      try {
        const innerDocument = frame.contentDocument;

        if (
          innerDocument &&
          boundFrameDocument !== innerDocument
        ) {
          /* 键盘翻页 */
          innerDocument.addEventListener(
            "keydown",
            handleKeydown
          );

          /*
           * 页面内容由 iframe 承载，
           * 因此鼠标移动也要在 iframe 内监听。
           */
          innerDocument.addEventListener(
            "mousemove",
            handlePointerMove
          );

          innerDocument.addEventListener(
            "mouseleave",
            handlePointerLeave
          );

          /* 触屏滑动翻页 */
          innerDocument.addEventListener(
            "touchstart",
            handleTouchStart,
            { passive: true }
          );

          innerDocument.addEventListener(
            "touchend",
            handleTouchEnd,
            { passive: true }
          );

          boundFrameDocument = innerDocument;
        }
      } catch (error) {
        console.warn("无法绑定 iframe 交互事件：", error);
      }
    }

    function attachFrameListeners() {
      if (frameListenersAttached) {
        return;
      }

      frame.addEventListener("load", handleFrameLoad);
      frameListenersAttached = true;
    }

    /**
     * 控制栏自动隐藏。
     */
    function showControls() {
      const presentation =
        document.getElementById("presentation");

      presentation.classList.add("controls-visible");

      clearTimeout(controlsTimer);
      controlsTimer = null;
    }

    function scheduleHideControls() {
      const presentation =
        document.getElementById("presentation");

      clearTimeout(controlsTimer);

      controlsTimer = window.setTimeout(() => {
        controlsTimer = null;

        /*
         * 仅在底部热区、控制栏自身或帮助面板
         * 打开时保持显示。
         */
        const keepVisible =
          pointerInRevealZone ||
          controlsEl.matches(":hover") ||
          presentation.classList.contains("controls-pinned") ||
          controlsEl.contains(document.activeElement) ||
          helpOpen;

        if (keepVisible) {
          return;
        }

        presentation.classList.remove("controls-visible");
      }, CONTROLS_HIDE_DELAY);
    }

    function pinControls() {
      const presentation =
        document.getElementById("presentation");

      presentation.classList.add("controls-pinned");
    }

    function unpinControls() {
      const presentation =
        document.getElementById("presentation");

      presentation.classList.remove("controls-pinned");

      scheduleHideControls();
    }

    /**
     * 键盘操作。
     */
    function handleKeydown(event) {
      const key = event.key;

      /*
       * 避免用户正在输入时触发翻页。
       */
      const target = event.target;

      if (
        target &&
        (
          target.tagName === "INPUT" ||
          target.tagName === "TEXTAREA" ||
          target.isContentEditable
        )
      ) {
        return;
      }

      if (
        key === "ArrowRight" ||
        key === "ArrowDown" ||
        key === "PageDown" ||
        key === " "
      ) {
        event.preventDefault();
        nextSlide();
        return;
      }

      if (
        key === "ArrowLeft" ||
        key === "ArrowUp" ||
        key === "PageUp"
      ) {
        event.preventDefault();
        prevSlide();
        return;
      }

      if (key === "Home") {
        event.preventDefault();
        firstSlide();
        return;
      }

      if (key === "End") {
        event.preventDefault();
        lastSlide();
        return;
      }

      if (key.toLowerCase() === "f") {
        event.preventDefault();
        toggleFullscreen();
        return;
      }

      if (key.toLowerCase() === "r") {
        event.preventDefault();
        frame.contentWindow.location.reload();
        return;
      }

      if (
        key.toLowerCase() === "h" ||
        key === "?"
      ) {
        event.preventDefault();
        toggleHelp();
        return;
      }

      if (
        key === "Escape" &&
        helpPanel.classList.contains("visible")
      ) {
        event.preventDefault();
        toggleHelp(false);
      }
    }

    /*
     * 鼠标进入窗口底部热区或移动时，
     * 短暂显示控制栏。
     */
    function handlePointerMove(event) {
      pointerInRevealZone =
        event.clientY >=
        window.innerHeight - CONTROLS_REVEAL_ZONE;

      if (changing) {
        return;
      }

      showControls();
      scheduleHideControls();
    }

    function handlePointerLeave() {
      pointerInRevealZone = false;
    }

    document.addEventListener("mousemove", handlePointerMove);

    document.addEventListener("mouseleave", handlePointerLeave);

    controlsEl.addEventListener(
      "mouseenter",
      pinControls
    );

    controlsEl.addEventListener(
      "mouseleave",
      unpinControls
    );

    controlsEl.addEventListener("focusin", showControls);

    controlsEl.addEventListener(
      "focusout",
      scheduleHideControls
    );

    /*
     * 键盘方向导航。
     */
    document.addEventListener("keydown", handleKeydown);

    prevZone.addEventListener("click", prevSlide);
    nextZone.addEventListener("click", nextSlide);

    prevButton.addEventListener("click", prevSlide);
    nextButton.addEventListener("click", nextSlide);

    fullscreenButton.addEventListener(
      "click",
      toggleFullscreen
    );

    helpButton.addEventListener(
      "click",
      () => toggleHelp()
    );

    helpClose.addEventListener(
      "click",
      () => toggleHelp(false)
    );

    helpPanel.addEventListener("click", event => {
      if (event.target === helpPanel) {
        toggleHelp(false);
      }
    });

    /*
     * 触屏滑动翻页。
     * 父文档与同源 iframe 内部共用同一组处理函数，
     * 避免一次滑动被重复监听而跳两页。
     */
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartedOnInteractive = false;

    /* 不触发滑动翻页的交互元素选择器 */
    const SWIPE_IGNORE_SELECTOR =
      'a, button, input, textarea, select, ' +
      '[contenteditable="true"], [data-no-swipe]';

    /**
     * 判断触摸起点是否位于不应触发翻页的交互元素内。
     * 兼容 SVG 节点与非 Element 目标。
     */
    function isInteractiveTarget(target) {
      if (!target || typeof target.closest !== "function") {
        return false;
      }

      return Boolean(target.closest(SWIPE_IGNORE_SELECTOR));
    }

    function handleTouchStart(event) {
      const touch = event.changedTouches && event.changedTouches[0];

      if (!touch) {
        return;
      }

      touchStartX = touch.clientX;
      touchStartY = touch.clientY;

      /*
       * 记录触摸起点是否位于交互元素内（链接、
       * 按钮、输入框、可编辑区域等）。
       * 即使在元素外结束，只要起点在交互元素内，也不翻页。
       */
      touchStartedOnInteractive = isInteractiveTarget(event.target);
    }

    function handleTouchEnd(event) {
      /*
       * 先取出起点状态并在任何退出路径前重置，
       * 避免下一次手势沿用旧值。
       */
      const startedOnInteractive = touchStartedOnInteractive;
      touchStartedOnInteractive = false;

      const touch = event.changedTouches && event.changedTouches[0];

      if (!touch) {
        return;
      }

      /*
       * 触摸起点位于可交互元素内（链接、按钮、
       * 输入框、可编辑区域等）时不翻页。
       */
      if (startedOnInteractive) {
        return;
      }

      const distanceX = touch.clientX - touchStartX;
      const distanceY = touch.clientY - touchStartY;

      /*
       * 横向移动超过 60px，
       * 且明显大于纵向移动时才触发翻页。
       */
      if (
        Math.abs(distanceX) > 60 &&
        Math.abs(distanceX) > Math.abs(distanceY)
      ) {
        if (distanceX < 0) {
          nextSlide();
        } else {
          prevSlide();
        }
      }
    }

    document.addEventListener(
      "touchstart",
      handleTouchStart,
      { passive: true }
    );

    document.addEventListener(
      "touchend",
      handleTouchEnd,
      { passive: true }
    );

    /*
     * 首次创建 iframe，并绑定加载监听。
     */
    function initializeFrame() {
      frame = document.createElement("iframe");
      frame.id = "slide-frame";
      frame.className = "is-loading";
      frame.title = "演示文稿页面";
      frame.setAttribute("allowfullscreen", "");

      frame.addEventListener("click", () => {
        try {
          frame.contentWindow.focus();
        } catch (error) {
          /* 跨源时忽略 */
        }
      });

      document
        .getElementById("presentation")
        .insertBefore(
          frame,
          document.getElementById("loading").nextSibling
        );

      attachFrameListeners();
    }

    /*
     * 初始化。
     */
    initializeFrame();
    updateInterface();
    showSlide(currentIndex, "next", true);
  </script>
</body>
</html>
