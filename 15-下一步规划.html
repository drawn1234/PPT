<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>下一步：从完成任务到独立负责</title>

  <style>
    :root {
      --bg: #080910;
      --panel: #121426;
      --line: rgba(255, 255, 255, 0.11);

      --text: #f7f7fb;
      --sub: #b8bdcd;
      --muted: #747a8f;

      --purple: #947cff;
      --purple-soft: rgba(148, 124, 255, 0.11);

      --yellow: #ffc547;
      --yellow-soft: rgba(255, 197, 71, 0.1);

      --green: #42dcb7;
      --green-soft: rgba(66, 220, 183, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      color: var(--text);
      font-family:
        "Microsoft YaHei",
        "PingFang SC",
        "Noto Sans CJK SC",
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #viewport {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      background: #05060a;
    }

    #slide {
      position: relative;

      width: 1600px;
      height: 900px;
      flex: 0 0 auto;

      overflow: hidden;
      transform-origin: center center;
      container-type: size;
      color: var(--text);

      background:
        radial-gradient(
          circle at 92% 8%,
          rgba(139, 124, 255, 0.17),
          transparent 28%
        ),
        radial-gradient(
          circle at 4% 96%,
          rgba(242, 185, 59, 0.05),
          transparent 25%
        ),
        linear-gradient(135deg, #080910 0%, #0a0b12 64%, #161229 100%);
    }

    .page {
      position: absolute;
      inset: 0;

      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      gap: clamp(16px, 2.2cqh, 28px);

      padding:
        clamp(28px, 4cqh, 52px)
        clamp(34px, 4cqw, 76px)
        clamp(24px, 2.9cqh, 34px);

      overflow: hidden;
    }

    #slide::before {
      content: "";
      position: absolute;
      z-index: 5;
      top: 0;
      left: 0;

      width: 680px;
      height: 4px;
      pointer-events: none;

      background: linear-gradient(
        90deg,
        #f2b93b,
        #8b7cff,
        transparent
      );
    }

    .header,
    .roadmap,
    .support,
    .footer {
      position: relative;
      z-index: 1;
    }

    /* 标题 */

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 30px;
      padding-bottom: clamp(16px, 2cqh, 24px);
      border-bottom: 1px solid var(--line);
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .page-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      min-width: 48px;
      height: 29px;
      padding: 0 14px;

      border: 1px solid #775b18;
      border-radius: 15px;

      color: #ffd466;
      background: rgba(48, 39, 19, 0.48);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    h1 {
      margin: 0;
      font-size: 36px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.04em;
    }

    h1 em {
      color: var(--yellow);
      font-style: normal;
    }

    .subtitle {
      margin: 10px 0 0 64px;
      color: #9296a5;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.5;
    }

    .page-mark {
      padding-top: 8px;
      color: #8178b5;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 3px;
      white-space: nowrap;
    }

    /* 三阶段路线 */

    .roadmap {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        62px
        minmax(0, 1fr)
        62px
        minmax(0, 1fr);
      align-items: center;
      min-height: 0;
    }

    .stage {
      position: relative;
      display: flex;
      min-height: clamp(250px, 40cqh, 390px);
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(24px, 2.4cqw, 40px);

      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          rgba(148, 124, 255, 0.09),
          transparent 62%
        ),
        rgba(18, 20, 38, 0.92);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 4px;
      background: var(--stage-color);
    }

    .stage-1 {
      --stage-color: var(--purple);
    }

    .stage-2 {
      --stage-color: var(--yellow);
      background:
        linear-gradient(
          145deg,
          rgba(255, 197, 71, 0.085),
          transparent 62%
        ),
        rgba(18, 20, 38, 0.92);
    }

    .stage-3 {
      --stage-color: var(--green);
      background:
        linear-gradient(
          145deg,
          rgba(66, 220, 183, 0.085),
          transparent 62%
        ),
        rgba(18, 20, 38, 0.92);
    }

    .stage-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stage-number {
      color: var(--stage-color);
      font-size: clamp(34px, 3cqw, 56px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.05em;
      opacity: 0.9;
    }

    .stage-status {
      padding: 7px 12px;
      border: 1px solid color-mix(in srgb, var(--stage-color) 38%, transparent);
      border-radius: 999px;

      color: var(--stage-color);
      background: color-mix(in srgb, var(--stage-color) 9%, transparent);

      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;
    }

    .stage-content {
      margin: clamp(22px, 3cqh, 36px) 0 auto;
    }

    .stage-kicker {
      margin-bottom: 9px;
      color: var(--stage-color);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .stage h2 {
      margin: 0;
      font-size: clamp(24px, 2cqw, 38px);
      line-height: 1.18;
      letter-spacing: -0.03em;
    }

    .stage p {
      max-width: 430px;
      margin: 15px 0 0;
      color: var(--sub);
      font-size: clamp(14px, 1cqw, 18px);
      line-height: 1.7;
    }

    .stage-result {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: clamp(22px, 3cqh, 36px);
      padding-top: 18px;
      border-top: 1px solid var(--line);

      color: var(--sub);
      font-size: clamp(13px, 0.9cqw, 16px);
      font-weight: 700;
    }

    .stage-result::before {
      content: "✓";
      display: grid;
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      place-items: center;

      border-radius: 50%;
      color: var(--stage-color);
      background: color-mix(in srgb, var(--stage-color) 11%, transparent);

      font-size: 12px;
      font-weight: 900;
    }

    .road-arrow {
      position: relative;
      width: 32px;
      height: 1px;
      justify-self: center;
      background: linear-gradient(90deg, #555a6c, #878da0);
    }

    .road-arrow::after {
      content: "";
      position: absolute;
      top: -4px;
      right: 0;
      width: 9px;
      height: 9px;

      border-top: 1px solid #9096a8;
      border-right: 1px solid #9096a8;

      transform: rotate(45deg);
    }

    /* 底部支持 */

    .support {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 24px;

      min-height: 68px;
      padding: 13px 20px;

      border: 1px solid rgba(255, 197, 71, 0.27);
      border-left: 4px solid var(--yellow);
      border-radius: 13px;

      background:
        linear-gradient(
          90deg,
          rgba(255, 197, 71, 0.09),
          rgba(148, 124, 255, 0.035),
          transparent
        ),
        rgba(18, 20, 38, 0.92);
    }

    .support-title {
      color: var(--yellow);
      font-size: 14px;
      font-weight: 850;
      white-space: nowrap;
    }

    .support-items {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .support-item {
      padding: 8px 15px;
      border: 1px solid rgba(148, 124, 255, 0.28);
      border-radius: 999px;

      color: #c5bbff;
      background: rgba(148, 124, 255, 0.07);

      font-size: clamp(12px, 0.85cqw, 15px);
      font-weight: 700;
    }

    .summary {
      color: var(--sub);
      font-size: clamp(13px, 0.9cqw, 16px);
      white-space: nowrap;
    }

    .summary strong {
      color: var(--yellow);
      font-weight: 800;
    }

    /* 页脚 */

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;

      color: #555a68;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .footer strong {
      color: #8178b5;
      font-weight: 600;
    }

  </style>
</head>

<body>
  <div id="viewport">
    <main id="slide">
      <div class="page">
    <!-- 标题 -->
    <header class="header">
      <div>
        <div class="title-row">
          <span class="page-number">04</span>
          <h1>下一步：从完成任务到<em>独立负责</em></h1>
        </div>

        <p class="subtitle">
          补齐能力、提升质量，逐步承担完整模块。
        </p>
      </div>

      <div class="page-mark">WORK OUTLOOK</div>
    </header>

    <!-- 三阶段成长路线 -->
    <section class="roadmap">
      <!-- 第一阶段 -->
      <article class="stage stage-1">
        <div class="stage-top">
          <span class="stage-number">01</span>
          <span class="stage-status">近期</span>
        </div>

        <div class="stage-content">
          <div class="stage-kicker">完成迁移</div>
          <h2>补齐功能</h2>

          <p>
            完成头条灯牌等迁移项，确保新旧框架行为一致。
          </p>
        </div>

        <div class="stage-result">核心能力迁移完成</div>
      </article>

      <span class="road-arrow"></span>

      <!-- 第二阶段 -->
      <article class="stage stage-2">
        <div class="stage-top">
          <span class="stage-number">02</span>
          <span class="stage-status">持续</span>
        </div>

        <div class="stage-content">
          <div class="stage-kicker">提升质量</div>
          <h2>沉淀方法</h2>

          <p>
            梳理日志、状态和调用链路，形成稳定的问题定位方法。
          </p>
        </div>

        <div class="stage-result">问题可以独立闭环</div>
      </article>

      <span class="road-arrow"></span>

      <!-- 第三阶段 -->
      <article class="stage stage-3">
        <div class="stage-top">
          <span class="stage-number">03</span>
          <span class="stage-status">进阶</span>
        </div>

        <div class="stage-content">
          <div class="stage-kicker">扩大能力</div>
          <h2>负责模块</h2>

          <p>
            深入消息分发、虚拟列表等场景，逐步承担完整模块设计。
          </p>
        </div>

        <div class="stage-result">独立完成设计与交付</div>
      </article>
    </section>

    <!-- 支持项 -->
    <section class="support">
      <div class="support-title">需要的支持</div>

      <div class="support-items">
        <span class="support-item">业务上下文</span>
        <span class="support-item">历史链路文档</span>
        <span class="support-item">复杂问题复盘</span>
      </div>

      <div class="summary">
        完成迁移 → 沉淀方法 → <strong>独立负责</strong>
      </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
      <span><strong>下一步规划</strong> · 工作展望 · 成长路线</span>
      <span>04 / OUTLOOK</span>
    </footer>
      </div>
    </main>
  </div>

  <script>
    function resizeSlide() {
      const slide = document.getElementById("slide");
      if (!slide) return;

      const viewportWidth = window.visualViewport
        ? window.visualViewport.width
        : window.innerWidth;

      const viewportHeight = window.visualViewport
        ? window.visualViewport.height
        : window.innerHeight;

      const scale = Math.min(
        viewportWidth / 1600,
        viewportHeight / 900
      );

      slide.style.transform = `scale(${scale})`;
    }

    resizeSlide();

    window.addEventListener("load", resizeSlide);
    window.addEventListener("resize", resizeSlide);
    window.addEventListener("orientationchange", resizeSlide);

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", resizeSlide);
    }
  </script>
</body>
</html>
