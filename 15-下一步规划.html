<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>下一步：从完成任务到独立负责</title>

  <style>
    :root {
      --bg: #080910;
      --panel: #121426;
      --line: rgba(255, 255, 255, 0.11);

      --text: #f7f7fb;
      --sub: #b8bdcd;
      --muted: #747a8f;

      --purple: #947cff;
      --purple-soft: rgba(148, 124, 255, 0.11);

      --yellow: #ffc547;
      --yellow-soft: rgba(255, 197, 71, 0.1);

      --green: #42dcb7;
      --green-soft: rgba(66, 220, 183, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      color: var(--text);
      font-family:
        Inter,
        "PingFang SC",
        "Microsoft YaHei",
        "Noto Sans SC",
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .slide {
      position: relative;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      gap: clamp(16px, 2.2vh, 28px);

      width: 100vw;
      height: 100vh;
      padding:
        clamp(28px, 4vh, 52px)
        clamp(34px, 4vw, 76px)
        clamp(18px, 2.5vh, 32px);

      overflow: hidden;

      background:
        radial-gradient(
          circle at 96% 0%,
          rgba(110, 82, 215, 0.2),
          transparent 31%
        ),
        radial-gradient(
          circle at 0% 100%,
          rgba(255, 197, 71, 0.05),
          transparent 25%
        ),
        linear-gradient(135deg, #080910 0%, #0c0d18 100%);
    }

    .slide::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.12;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.022) 1px,
          transparent 1px
        );
      background-size: 52px 52px;
      mask-image: linear-gradient(to bottom, transparent, #000 28%, #000);
    }

    .header,
    .roadmap,
    .support,
    .footer {
      position: relative;
      z-index: 1;
    }

    /* 标题 */

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 30px;
      padding-bottom: clamp(16px, 2vh, 24px);
      border-bottom: 1px solid var(--line);
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .page-number {
      display: grid;
      flex: 0 0 auto;
      width: 48px;
      height: 28px;
      place-items: center;

      border: 1px solid rgba(255, 197, 71, 0.65);
      border-radius: 999px;

      color: var(--yellow);
      font-size: 12px;
      font-weight: 850;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 2.5vw, 48px);
      line-height: 1.12;
      letter-spacing: -0.04em;
    }

    h1 em {
      color: var(--yellow);
      font-style: normal;
    }

    .subtitle {
      margin: 10px 0 0 64px;
      color: var(--sub);
      font-size: clamp(15px, 1.05vw, 19px);
      line-height: 1.5;
    }

    .page-mark {
      padding-top: 10px;
      color: rgba(177, 160, 255, 0.82);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.27em;
      white-space: nowrap;
    }

    /* 三阶段路线 */

    .roadmap {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        62px
        minmax(0, 1fr)
        62px
        minmax(0, 1fr);
      align-items: center;
      min-height: 0;
    }

    .stage {
      position: relative;
      display: flex;
      min-height: clamp(250px, 40vh, 390px);
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(24px, 2.4vw, 40px);

      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          rgba(148, 124, 255, 0.09),
          transparent 62%
        ),
        rgba(18, 20, 38, 0.92);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 4px;
      background: var(--stage-color);
    }

    .stage-1 {
      --stage-color: var(--purple);
    }

    .stage-2 {
      --stage-color: var(--yellow);
      background:
        linear-gradient(
          145deg,
          rgba(255, 197, 71, 0.085),
          transparent 62%
        ),
        rgba(18, 20, 38, 0.92);
    }

    .stage-3 {
      --stage-color: var(--green);
      background:
        linear-gradient(
          145deg,
          rgba(66, 220, 183, 0.085),
          transparent 62%
        ),
        rgba(18, 20, 38, 0.92);
    }

    .stage-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stage-number {
      color: var(--stage-color);
      font-size: clamp(34px, 3vw, 56px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.05em;
      opacity: 0.9;
    }

    .stage-status {
      padding: 7px 12px;
      border: 1px solid color-mix(in srgb, var(--stage-color) 38%, transparent);
      border-radius: 999px;

      color: var(--stage-color);
      background: color-mix(in srgb, var(--stage-color) 9%, transparent);

      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;
    }

    .stage-content {
      margin: clamp(22px, 3vh, 36px) 0 auto;
    }

    .stage-kicker {
      margin-bottom: 9px;
      color: var(--stage-color);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .stage h2 {
      margin: 0;
      font-size: clamp(24px, 2vw, 38px);
      line-height: 1.18;
      letter-spacing: -0.03em;
    }

    .stage p {
      max-width: 430px;
      margin: 15px 0 0;
      color: var(--sub);
      font-size: clamp(14px, 1vw, 18px);
      line-height: 1.7;
    }

    .stage-result {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: clamp(22px, 3vh, 36px);
      padding-top: 18px;
      border-top: 1px solid var(--line);

      color: var(--sub);
      font-size: clamp(13px, 0.9vw, 16px);
      font-weight: 700;
    }

    .stage-result::before {
      content: "✓";
      display: grid;
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      place-items: center;

      border-radius: 50%;
      color: var(--stage-color);
      background: color-mix(in srgb, var(--stage-color) 11%, transparent);

      font-size: 12px;
      font-weight: 900;
    }

    .road-arrow {
      position: relative;
      width: 32px;
      height: 1px;
      justify-self: center;
      background: linear-gradient(90deg, #555a6c, #878da0);
    }

    .road-arrow::after {
      content: "";
      position: absolute;
      top: -4px;
      right: 0;
      width: 9px;
      height: 9px;

      border-top: 1px solid #9096a8;
      border-right: 1px solid #9096a8;

      transform: rotate(45deg);
    }

    /* 底部支持 */

    .support {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 24px;

      min-height: 68px;
      padding: 13px 20px;

      border: 1px solid rgba(255, 197, 71, 0.27);
      border-left: 4px solid var(--yellow);
      border-radius: 13px;

      background:
        linear-gradient(
          90deg,
          rgba(255, 197, 71, 0.09),
          rgba(148, 124, 255, 0.035),
          transparent
        ),
        rgba(18, 20, 38, 0.92);
    }

    .support-title {
      color: var(--yellow);
      font-size: 14px;
      font-weight: 850;
      white-space: nowrap;
    }

    .support-items {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .support-item {
      padding: 8px 15px;
      border: 1px solid rgba(148, 124, 255, 0.28);
      border-radius: 999px;

      color: #c5bbff;
      background: rgba(148, 124, 255, 0.07);

      font-size: clamp(12px, 0.85vw, 15px);
      font-weight: 700;
    }

    .summary {
      color: var(--sub);
      font-size: clamp(13px, 0.9vw, 16px);
      white-space: nowrap;
    }

    .summary strong {
      color: var(--yellow);
      font-weight: 800;
    }

    /* 页脚 */

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;

      color: var(--muted);
      font-size: 9px;
      font-weight: 650;
      letter-spacing: 0.1em;
    }

    .footer strong {
      color: #a596ee;
    }

    /* 较矮屏幕 */

    @media (max-height: 760px) {
      .slide {
        gap: 10px;
        padding-top: 18px;
        padding-bottom: 12px;
      }

      .header {
        padding-bottom: 10px;
      }

      .subtitle {
        margin-top: 5px;
      }

      .stage {
        min-height: 225px;
        padding: 20px;
      }

      .stage-content {
        margin-top: 16px;
      }

      .stage p {
        margin-top: 10px;
        line-height: 1.55;
      }

      .stage-result {
        margin-top: 15px;
        padding-top: 13px;
      }

      .support {
        min-height: 56px;
        padding-top: 9px;
        padding-bottom: 9px;
      }
    }

    @media (max-width: 1100px) {
      .slide {
        padding-left: 24px;
        padding-right: 24px;
      }

      .roadmap {
        grid-template-columns:
          minmax(0, 1fr)
          40px
          minmax(0, 1fr)
          40px
          minmax(0, 1fr);
      }

      .stage {
        padding: 20px;
      }

      .page-mark,
      .summary {
        display: none;
      }

      .support {
        grid-template-columns: auto minmax(0, 1fr);
      }
    }
  </style>
</head>

<body>
  <main class="slide">
    <!-- 标题 -->
    <header class="header">
      <div>
        <div class="title-row">
          <span class="page-number">04</span>
          <h1>下一步：从完成任务到<em>独立负责</em></h1>
        </div>

        <p class="subtitle">
          补齐能力、提升质量，逐步承担完整模块。
        </p>
      </div>

      <div class="page-mark">WORK OUTLOOK</div>
    </header>

    <!-- 三阶段成长路线 -->
    <section class="roadmap">
      <!-- 第一阶段 -->
      <article class="stage stage-1">
        <div class="stage-top">
          <span class="stage-number">01</span>
          <span class="stage-status">近期</span>
        </div>

        <div class="stage-content">
          <div class="stage-kicker">完成迁移</div>
          <h2>补齐功能</h2>

          <p>
            完成头条灯牌等迁移项，确保新旧框架行为一致。
          </p>
        </div>

        <div class="stage-result">核心能力迁移完成</div>
      </article>

      <span class="road-arrow"></span>

      <!-- 第二阶段 -->
      <article class="stage stage-2">
        <div class="stage-top">
          <span class="stage-number">02</span>
          <span class="stage-status">持续</span>
        </div>

        <div class="stage-content">
          <div class="stage-kicker">提升质量</div>
          <h2>沉淀方法</h2>

          <p>
            梳理日志、状态和调用链路，形成稳定的问题定位方法。
          </p>
        </div>

        <div class="stage-result">问题可以独立闭环</div>
      </article>

      <span class="road-arrow"></span>

      <!-- 第三阶段 -->
      <article class="stage stage-3">
        <div class="stage-top">
          <span class="stage-number">03</span>
          <span class="stage-status">进阶</span>
        </div>

        <div class="stage-content">
          <div class="stage-kicker">扩大能力</div>
          <h2>负责模块</h2>

          <p>
            深入消息分发、虚拟列表等场景，逐步承担完整模块设计。
          </p>
        </div>

        <div class="stage-result">独立完成设计与交付</div>
      </article>
    </section>

    <!-- 支持项 -->
    <section class="support">
      <div class="support-title">需要的支持</div>

      <div class="support-items">
        <span class="support-item">业务上下文</span>
        <span class="support-item">历史链路文档</span>
        <span class="support-item">复杂问题复盘</span>
      </div>

      <div class="summary">
        完成迁移 → 沉淀方法 → <strong>独立负责</strong>
      </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
      <span><strong>下一步规划</strong> · 工作展望 · 成长路线</span>
      <span>04 / OUTLOOK</span>
    </footer>
  </main>
</body>
</html>
